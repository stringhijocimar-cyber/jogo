name: Build Android APK

on:
  push:
    branches:
      - feature/trilha-android
      - agent/test-write-access
  pull_request:
    branches:
      - agent/test-write-access
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Trilha-Jocimar.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trilha-Jocimar-Android
          path: Trilha-Jocimar.apk
          if-no-files-found: error

      - name: Publish/update downloadable release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: trilha-latest
          name: Trilha Android - Última versão
          body: APK Android gerado automaticamente a partir da versão mais recente do jogo de Trilha.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: Trilha-Jocimar.apk
